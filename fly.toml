# Configuración de despliegue en la nube para Fly.io (TCP en tiempo real puerto 7777)
# Uso: fly launch --copy-config && fly volumes create gatote_data --size 1 && fly deploy
app = "gatote-fractal-server"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7777"
  SERVER_DATA_DIR = "/data"

[mounts]
  source = "gatote_data"
  destination = "/data"

[[services]]
  internal_port = 7777
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 7777
